[package]
name = "agent-visuals"
version = "0.1.0"
edition = "2021"
description = "Offline renderer for generative 3D agent network animations"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
